[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salad-fal-benchmark"
version = "0.1.0"
description = "Benchmark fal.ai vs Salad GPU for Teselio Rust-prod analyze preprocess"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bench = "bench.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
