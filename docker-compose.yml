# Local mock inference stack — build from repo root (see docker/sam3 and docker/depth Dockerfiles).
services:
  sam3:
    build:
      context: .
      dockerfile: docker/sam3/Dockerfile
    ports:
      - "8001:8000"
    environment:
      MOCK_INFERENCE: "1"

  depth:
    build:
      context: .
      dockerfile: docker/depth/Dockerfile
    ports:
      - "8002:8000"
    environment:
      MOCK_INFERENCE: "1"
