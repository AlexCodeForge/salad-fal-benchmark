# SCE container group template — unified SAM3 + depth (bench-analyze).
# deploy.py sets container.image from SALAD_ANALYZE_IMAGE.
#
# GPU class UUIDs (Salad org gpu-classes): A5000, 3090, 4090, 3090 Ti, 5080, 5070 Ti

name: bench-analyze
display_name: bench-analyze

container:
  image: ""  # required: SALAD_ANALYZE_IMAGE
  priority: low
  environment_variables:
    MOCK_INFERENCE: "0"
    SAM3_MODEL: "facebook/sam3"
    MODEL_ID: "depth-anything/Depth-Anything-V2-Large-hf"
    HOST: "::"
    PORT: "8000"
    DEPLOY_REV: "2"
  resources:
    cpu: 4
    memory: 8192
    gpu_classes:
      - 6d4e9e99-d27e-4751-8d7d-393f7d8ea949   # RTX A5000 (24 GB)
      - a5db5c50-cbcb-4596-ae80-6a0c8090d80f   # RTX 3090 (24 GB)
      - ed563892-aacd-40f5-80b7-90c9be6c759b   # RTX 4090 (24 GB)
      - 9998fe42-04a5-4807-b3a5-849943f16c38   # RTX 3090 Ti (24 GB)
      - 8065b30b-4a27-434c-8610-222e8df8fad7   # RTX 5080 (16 GB)
      - 1b8747be-e789-475b-a339-3c1028010d84   # RTX 5070 Ti (16 GB)
    storage_amount: 26843545600  # 25 GiB

autostart_policy: true
restart_policy: always
replicas: 1

networking:
  protocol: http
  port: 8000
  auth: true
